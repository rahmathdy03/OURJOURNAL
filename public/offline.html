<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#171717" />
  <title>OURJOURNAL · Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5f0;color:#171717;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
    main{width:min(100%,440px);background:white;border:1px solid rgba(0,0,0,.06);border-radius:28px;padding:28px;box-shadow:0 18px 55px rgba(0,0,0,.08)}
    .icon{width:52px;height:52px;border-radius:18px;background:#171717;color:white;display:grid;place-items:center;font-weight:900;margin-bottom:22px}
    .eyebrow{font-size:12px;font-weight:800;color:#ea580c;text-transform:uppercase;letter-spacing:.12em}
    h1{font-size:30px;line-height:1.05;margin:8px 0 10px}p{color:#737373;line-height:1.65;font-size:14px;margin:0}
    button{margin-top:22px;width:100%;border:0;border-radius:14px;background:#f97316;color:white;font-weight:800;padding:13px 16px;font-size:14px}
    small{display:block;margin-top:14px;color:#a3a3a3;line-height:1.5}
  </style>
</head>
<body>
  <main>
    <div class="icon">OJ</div>
    <div class="eyebrow">Mode offline</div>
    <h1>Belum ada salinan halaman ini.</h1>
    <p>OURJOURNAL bisa membuka halaman yang sudah pernah dikunjungi saat perangkat online. Sambungkan internet sebentar untuk memuat halaman ini pertama kali.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
    <small>Data privat tidak dikirim ke tempat lain. Perubahan data tetap membutuhkan koneksi internet.</small>
  </main>
</body>
</html>
